<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения — EKD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slide-panel" id="slidePanel">
    <div class="panel-trigger">
        <i class="fas fa-chevron-right"></i>
        <span>Меню</span>
    </div>
    <div class="panel-content">
        <div class="panel-logo">
            <img src="images/logo.png" alt="EKD" id="panelLogo">
        </div>
        <nav class="panel-nav">
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="schedule.html"><i class="fas fa-calendar"></i> Расписание</a>
            <a href="lessons.html"><i class="fas fa-video"></i> Занятия</a>
            <a href="homework.html"><i class="fas fa-book"></i> Домашние работы</a>
            <a href="curator.html"><i class="fas fa-user-graduate"></i> Онлайн-куратор</a>
            <a href="achievements.html" class="active"><i class="fas fa-trophy"></i> Достижения</a>
            <a href="invite.html"><i class="fas fa-user-plus"></i> Пригласи друга</a>
            <a href="subscriptions.html"><i class="fas fa-crown"></i> Подписки</a>
        </nav>
        <div class="panel-footer">
            <div class="user-info" id="panelUserInfo">
                <img src="images/default-avatar.png" alt="User" id="panelAvatar">
                <span id="panelUserName">Гость</span>
            </div>
            <button class="admin-access-btn" id="adminAccessBtn" onclick="checkAdminAccess()">
                <i class="fas fa-cog"></i> Управление
            </button>
            <button class="logout-btn" id="logoutBtn" onclick="logout()" style="display:none;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>
    </div>
</div>

<div class="main-content">
    <header class="main-header rounded-header">
        <div class="header-left">
            <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </div>
            <div class="header-logo">
                <img src="images/logo.png" alt="EKD" id="headerLogo">
            </div>
        </div>
        <div class="header-right">
            <span class="notification-bell"><i class="fas fa-bell"></i></span>
            <div class="auth-buttons" id="authButtons">
                <button class="login-top-btn" onclick="window.location.href='login.html'">Войти</button>
            </div>
            <div class="user-profile" id="userProfile" style="display:none;">
                <img src="images/default-avatar.png" alt="User" id="headerUserAvatar" class="user-avatar">
                <span id="headerUserName">Гость</span>
            </div>
        </div>
    </header>

    <section class="page-content">
        <h1 class="page-title">🏆 ДОСТИЖЕНИЯ</h1>
        
        <div class="achievements-posts" id="achievementsPosts">
            <!-- Посты загружаются из JS -->
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
